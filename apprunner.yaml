version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: streamlit run app.py --server.port=8080 --server.address=0.0.0.0 --server.headless=true
  network:
    port: 8080
  env:
    - name: S3_BUCKET
      value: gts-latam-efile-tracker
    - name: AWS_REGION
      value: us-east-1
