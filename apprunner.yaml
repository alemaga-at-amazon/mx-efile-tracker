version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install streamlit pandas boto3 openpyxl
run:
  command: python -m streamlit run app.py --server.port 8080 --server.address 0.0.0.0 --server.headless true
  network:
    port: 8080
  env:
    - name: S3_BUCKET
      value: "gts-latam-mx-efile-alemaga"
    - name: S3_KEY
      value: "mx-efile/MX_EFile_Tracker.xlsx"
    - name: AWS_DEFAULT_REGION
      value: "us-east-1"
